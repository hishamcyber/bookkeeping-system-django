<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>All Transaction Records | Bookkeeping System</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
        }

        /* Global Theme Variables (Shared across all templates) */
        :root {
            --neon-green: #00ff41;
            --mid-green: #00aa2b;
            --neon-red: #ff2b4f;
            --dark-bg: #000000;
            --card-bg: #070709;
            --input-bg: #0f0f12;
            --text-white: #e6ffe6;
            --text-gray: #b2ccbc;
            --border-glow: rgba(0, 255, 65, 0.35);
        }

        body {
            min-height: 100vh;
            background: var(--dark-bg);
            color: var(--text-white);
            overflow-x: hidden;
            padding: 50px 25px;
        }

        /* Fullscreen 3D Background + Cyber Grid Overlay */
        #bg-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: -3;
        }
        .grid-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-image: linear-gradient(var(--border-glow) 1px, transparent 1px),
            linear-gradient(90deg, var(--border-glow) 1px, transparent 1px);
            background-size: 45px 45px;
            z-index: -2;
            pointer-events: none;
        }

        /* Global Animations */
        @keyframes pulseGlow {
            0%,100% { box-shadow: 0 0 15px var(--mid-green); }
            50% { box-shadow: 0 0 30px var(--neon-green), 0 0 50px rgba(0,255,65,0.25); }
        }
        @keyframes sweepShine {
            0% { background-position: -200% 0; }
            100% { background-position: 200% 0; }
        }
        @keyframes softFloat {
            0%,100% { transform: translateY(0); }
            50% { transform: translateY(-6px); }
        }
        @keyframes headerFlicker {
            0%,92%,94%,96%,100% { text-shadow: 0 0 14px var(--neon-green); }
            93%,95% { text-shadow: 0 0 4px var(--neon-green); }
        }

        /* Main Page Wrapper */
        .records-wrapper {
            position: relative;
            z-index: 2;
            max-width: 1200px;
            margin: 0 auto;
        }

        /* Header Section */
        .page-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 45px;
            flex-wrap: wrap;
            gap: 20px;
        }
        .page-header h1 {
            font-size: 2.8rem;
            color: var(--neon-green);
            animation: headerFlicker 5s infinite linear;
            letter-spacing: 1px;
        }

        /* Universal Cyber Button */
        .cyber-btn {
            position: relative;
            display: inline-block;
            padding: 15px 30px;
            background: linear-gradient(135deg, var(--mid-green), var(--neon-green));
            color: #000;
            text-decoration: none;
            font-weight: 700;
            font-size: 1.05rem;
            border-radius: 10px;
            overflow: hidden;
            transition: all 0.35s ease;
        }
        .cyber-btn::before {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.3), transparent);
            background-size: 200% 100%;
            animation: sweepShine 3.2s infinite linear;
        }
        .cyber-btn:hover {
            transform: translateY(-4px) scale(1.03);
            animation: pulseGlow 1.8s infinite ease-in-out;
        }
        .cyber-btn:active {
            transform: translateY(1px) scale(0.98);
        }

        /* Records List Container Card */
        .records-card {
            background: var(--card-bg);
            border: 1px solid var(--border-glow);
            border-radius: 20px;
            padding: 40px;
            overflow: hidden;
            position: relative;
            animation: softFloat 7s infinite ease-in-out;
        }
        .records-card::after {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(0,255,65,0.06), transparent);
            background-size: 200% 100%;
            animation: sweepShine 6s infinite linear;
            pointer-events: none;
        }

        /* Transaction List Styling */
        .transaction-list {
            list-style: none;
        }
        .transaction-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 15px;
            padding: 20px 24px;
            margin: 16px 0;
            background: var(--input-bg);
            border-radius: 12px;
            border-left: 5px solid transparent;
            font-size: 1.1rem;
            transition: all 0.3s ease;
        }
        .transaction-item:hover {
            transform: translateX(8px);
            box-shadow: 0 0 22px rgba(0,255,65,0.22);
        }
        /* Color code Income / Expense rows */
        .income-row { border-left-color: var(--neon-green); }
        .expense-row { border-left-color: var(--neon-red); }

        /* Transaction Text Segments */
        .trans-type {
            font-weight: 600;
        }
        .trans-income { color: var(--neon-green); text-shadow: 0 0 8px rgba(0,255,65,0.4); }
        .trans-expense { color: var(--neon-red); text-shadow: 0 0 8px rgba(255,43,79,0.4); }
        .trans-amount {
            font-size: 1.3rem;
            font-weight: bold;
            min-width: 120px;
            text-align: center;
        }
        .trans-remarks {
            color: var(--text-gray);
            font-size: 0.95rem;
            flex-grow: 1;
            text-align: right;
        }

        /* Empty State Styling */
        .empty-record {
            text-align: center;
            padding: 60px 20px;
            color: var(--text-gray);
            font-size: 1.2rem;
        }
        .empty-record .cyber-btn {
            margin-top: 25px;
        }
    </style>
</head>
<body>
    <!-- 3D Animated Background + Cyber Grid -->
    <canvas id="bg-canvas"></canvas>
    <div class="grid-overlay"></div>

    <div class="records-wrapper">
        <!-- Page Header -->
        <div class="page-header">
            <h1>All Transaction Records</h1>
            <a href="{% url 'add_record' %}" class="cyber-btn">+ Add New Record</a>
        </div>

        <!-- Main Records Card Panel -->
        <div class="records-card">
            <ul class="transaction-list">
                {% for r in records %}
                <li class="transaction-item {% if r.transaction_type == 'Income' %}income-row{% else %}expense-row{% endif %}">
                    <span class="trans-type {% if r.transaction_type == 'Income' %}trans-income{% else %}trans-expense{% endif %}">
                        {{ r.transaction_type }}
                    </span>
                    <span class="trans-amount">{{ r.amount }}</span>
                    <span class="trans-remarks">Remarks: {{ r.remarks }}</span>
                </li>
                {% empty %}
                <li class="empty-record">
                    No transaction records found in your bookkeeping system.
                    <br>
                    <a href="{% url 'add_record' %}" class="cyber-btn">Create Your First Record</a>
                </li>
                {% endfor %}
            </ul>
        </div>
    </div>

    <!-- Three.js Slow Calm 3D Particle Background (Matching All Pages) -->
    <script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
    <script>
        const canvas = document.getElementById('bg-canvas');
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ canvas, alpha: true, antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);

        // Dual layer soft particles for depth without distraction
        const geo1 = new THREE.BufferGeometry();
        const count1 = 600;
        const pos1 = new Float32Array(count1 * 3);
        for(let i = 0; i < count1 *3; i++) pos1[i] = (Math.random()-0.5)*22;
        geo1.setAttribute('position', new THREE.BufferAttribute(pos1,3));
        const mat1 = new THREE.PointsMaterial({ color:0x00ff41, size:0.12, transparent:true, opacity:0.6 });
        const mesh1 = new THREE.Points(geo1, mat1);
        scene.add(mesh1);

        const geo2 = new THREE.BufferGeometry();
        const count2 = 1400;
        const pos2 = new Float32Array(count2 *3);
        for(let i = 0; i < count2 *3; i++) pos2[i] = (Math.random()-0.5)*30;
        geo2.setAttribute('position', new THREE.BufferAttribute(pos2,3));
        const mat2 = new THREE.PointsMaterial({ color:0x88ffaa, size:0.04, transparent:true, opacity:0.4 });
        const mesh2 = new THREE.Points(geo2, mat2);
        scene.add(mesh2);

        camera.position.z = 6;

        function animate() {
            requestAnimationFrame(animate);
            mesh1.rotation.x += 0.0002;
            mesh1.rotation.y += 0.0003;
            mesh2.rotation.x -= 0.0001;
            mesh2.rotation.y -= 0.0002;
            renderer.render(scene, camera);
        }
        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        })
    </script>
</body>
</html>
