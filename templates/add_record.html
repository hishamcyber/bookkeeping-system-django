<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add New Record | Bookkeeping System</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
        }

        :root {
            --neon-green: #00ff41;
            --mid-green: #00aa2b;
            --neon-red: #ff2b4f;
            --dark-bg: #000000;
            --card-bg: #070709;
            --input-bg: #0f0f12;
            --text-white: #e6ffe6;
            --text-gray: #b2ccbc;
            --border-glow: rgba(0, 255, 65, 0.35);
        }

        body {
            min-height: 100vh;
            background: var(--dark-bg);
            color: var(--text-white);
            overflow-x: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px 20px;
        }

        /* 3D Background & Cyber Grid Overlay */
        #bg-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: -3;
        }

        .grid-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-image: linear-gradient(var(--border-glow) 1px, transparent 1px),
            linear-gradient(90deg, var(--border-glow) 1px, transparent 1px);
            background-size: 45px 45px;
            z-index: -2;
            pointer-events: none;
        }

        /* Global Animations */
        @keyframes pulseGlow {
            0%,100% { box-shadow: 0 0 15px var(--mid-green); }
            50% { box-shadow: 0 0 30px var(--neon-green), 0 0 50px rgba(0,255,65,0.25); }
        }

        @keyframes sweepShine {
            0% { background-position: -200% 0; }
            100% { background-position: 200% 0; }
        }

        @keyframes softFloat {
            0%,100% { transform: translateY(0); }
            50% { transform: translateY(-6px); }
        }

        /* Main Form Container Card */
        .form-container {
            position: relative;
            z-index: 2;
            width: 100%;
            max-width: 520px;
            background: var(--card-bg);
            border: 1px solid var(--border-glow);
            border-radius: 22px;
            padding: 45px 40px;
            box-shadow: 0 0 25px rgba(0,255,65,0.15);
            animation: softFloat 7s infinite ease-in-out;
            overflow: hidden;
        }

        .form-container::after {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(0,255,65,0.06), transparent);
            background-size: 200% 100%;
            animation: sweepShine 6s infinite linear;
            pointer-events: none;
        }

        .page-heading {
            font-size: 2.4rem;
            color: var(--neon-green);
            text-align: center;
            margin-bottom: 35px;
            text-shadow: 0 0 12px var(--neon-green);
            letter-spacing: 1px;
        }

        /* Django Form Field Styling (form.as_p) */
        form p {
            margin-bottom: 22px;
        }

        form label {
            display: block;
            color: var(--text-gray);
            font-size: 0.95rem;
            margin-bottom: 8px;
            font-weight: 500;
        }

        form input,
        form select,
        form textarea {
            width: 100%;
            padding: 14px 18px;
            background: var(--input-bg);
            border: 1px solid var(--border-glow);
            border-radius: 10px;
            color: var(--text-white);
            font-size: 1rem;
            transition: all 0.3s ease;
            outline: none;
        }

        form input:focus,
        form select:focus,
        form textarea:focus {
            border-color: var(--neon-green);
            box-shadow: 0 0 18px rgba(0,255,65,0.35);
            background: #121218;
        }

        /* Submit Cyber Button */
        .btn-submit {
            width: 100%;
            padding: 16px;
            margin-top: 12px;
            background: linear-gradient(135deg, var(--mid-green), var(--neon-green));
            border: none;
            border-radius: 10px;
            color: #000;
            font-weight: 700;
            font-size: 1.1rem;
            cursor: pointer;
            transition: all 0.35s ease;
            position: relative;
            overflow: hidden;
        }

        .btn-submit::before {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.25), transparent);
            background-size: 200% 100%;
            animation: sweepShine 3.5s infinite linear;
        }

        .btn-submit:hover {
            transform: translateY(-3px) scale(1.02);
            animation: pulseGlow 2s infinite ease-in-out;
        }

        .btn-submit:active {
            transform: translateY(1px) scale(0.99);
        }

        /* Back Navigation Link */
        .back-link {
            display: inline-block;
            width: 100%;
            text-align: center;
            margin-top: 20px;
            color: var(--text-gray);
            text-decoration: none;
            font-size: 0.95rem;
            transition: all 0.3s ease;
        }

        .back-link:hover {
            color: var(--neon-green);
            text-shadow: 0 0 8px var(--neon-green);
        }

        /* Form Validation Error Styling */
        .errorlist {
            list-style: none;
            padding: 8px 12px;
            margin: 8px 0;
            background: rgba(255,43,79,0.15);
            border: 1px solid var(--neon-red);
            border-radius: 8px;
            color: var(--neon-red);
            font-size: 0.9rem;
        }
    </style>
</head>
<body>
    <!-- 3D Animated Particle Background -->
    <canvas id="bg-canvas"></canvas>
    <!-- Cyber Grid Overlay Layer -->
    <div class="grid-overlay"></div>

    <div class="form-container">
    <h1 class="page-heading">Add New Record</h1>

    <form method="POST">
        {% csrf_token %}

        <p>
    <label for="id_main_category">Main Category</label>
    <select name="main_category" id="id_main_category" required>
        <option value="">-- Select Main Category --</option>
        {% for mc in form.fields.main_category.queryset %}
            <option value="{{ mc.id }}">{{ mc.name }}</option>
        {% endfor %}
    </select>
</p>

        <p>
            <label for="id_subcategory">Sub Category (optional)</label>
            <select name="subcategory" id="id_subcategory">
                <option value="">-- Select Main Category First --</option>
            </select>
        </p>

        <p>
            <label for="id_transaction_type">Transaction Type</label>
            <select name="transaction_type" id="id_transaction_type" required>
                <option value="income">Income</option>
                <option value="expense">Expense</option>
            </select>
        </p>

        <p>
            <label for="id_amount">Amount</label>
            <input type="number" name="amount" id="id_amount" step="0.01" min="0" required>
        </p>

        <p>
            <label for="id_remarks">Remarks (optional)</label>
            <textarea name="remarks" id="id_remarks" rows="3"></textarea>
        </p>

        <button class="btn-submit" type="submit">Save Record</button>
    </form>

    <a href="{% url 'records' %}" class="back-link">← Back to Records</a>
</div>

    <!-- Three.js 3D Background Script -->
    <script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
    <script>


        document.getElementById('id_main_category').addEventListener('change', function() {
        const mainId = this.value;
        const subSelect = document.getElementById('id_subcategory');

        subSelect.innerHTML = '<option value="">-- Select Sub Category --</option>';

        if (mainId) {
            fetch(`/records/get-subcategories/?main_id=${mainId}`)
                .then(res => res.json())
                .then(data => {
                    if (data.subcategories.length === 0) {
                        subSelect.innerHTML = '<option value="">No subcategories available</option>';
                    } else {
                        data.subcategories.forEach(sub => {
                            const option = document.createElement('option');
                            option.value = sub.id;
                            option.textContent = sub.name;
                            subSelect.appendChild(option);
                        });
                    }
                });
        }
    });



        const canvas = document.getElementById('bg-canvas');
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ canvas, alpha: true, antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);

        // Slow soft particles (non-distracting for form filling)
        const geo = new THREE.BufferGeometry();
        const count = 900;
        const positions = new Float32Array(count * 3);
        for(let i = 0; i < count * 3; i++){
            positions[i] = (Math.random() - 0.5) * 25;
        }
        geo.setAttribute('position', new THREE.BufferAttribute(positions,3));

        const mat = new THREE.PointsMaterial({
            color: 0x00ff41,
            size: 0.07,
            transparent: true,
            opacity: 0.45
        });

        const particles = new THREE.Points(geo, mat);
        scene.add(particles);
        camera.position.z = 6;

        // Calm slow rotation animation
        function animate(){
            requestAnimationFrame(animate);
            particles.rotation.x += 0.0002;
            particles.rotation.y += 0.0003;
            renderer.render(scene, camera);
        }
        animate();

        // Responsive resize handler
        window.addEventListener('resize', ()=>{
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        })
    </script>
</body>
</html>
