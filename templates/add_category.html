<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add New Record | Bookkeeping System</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.12/dist/gsap.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Roboto, monospace;
        }

        :root {
            --primary-blue: #00A4E6;
            --primary-purple: #c944ff;
            --accent-red: #ff2b4f;
            --dark-bg: #121420;
            --card-bg: rgba(20, 22, 36, 0.65);
            --input-bg: rgba(25, 28, 45, 0.7);
            --text-white: #ffffff;
            --text-gray: #b0c4de;
        }

        body {
            overflow-x: hidden;
            min-height: 100vh;
            background: var(--dark-bg);
            padding: 0;
            color: var(--text-white);
            perspective: 1200px;
        }

        #bg-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: -3;
            pointer-events: none;
        }
        .grid-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-image: linear-gradient(rgba(0, 164, 230, 0.06) 1px, transparent 1px),
            linear-gradient(90deg, rgba(201, 68, 255, 0.06) 1px, transparent 1px);
            background-size: 45px 45px;
            z-index: -2;
            pointer-events: none;
        }

        @keyframes sweepGlow {
            0% { background-position: -200% 0; }
            100% { background-position: 200% 0; }
        }
        @keyframes pulseGlow {
            0%,100% { box-shadow: 0 0 15px rgba(0,164,230,0.3); }
            50% { box-shadow: 0 0 30px var(--primary-blue), 0 0 45px rgba(201, 68, 255,0.4); }
        }
        @keyframes floatUp {
            0%,100% { transform: translateY(0px) rotate3d(0,0,0,0deg); }
            50% { transform: translateY(-6px) rotate3d(0.2,0.15,0,1deg); }
        }
        @keyframes textGlow {
            0%, 100% {
                text-shadow: 0 15px 25px rgba(0, 164, 230, 0.55);
            }
            50% {
                text-shadow: 0 18px 35px rgba(0, 164, 230, 0.7);
            }
        }

        .main-nav {
            position: sticky;
            top: 0;
            z-index: 10;
            backdrop-filter: blur(14px);
            background: rgba(20,22,36,0.6);
            border-bottom: 1px solid rgba(0,164,230,0.3);
            padding: 20px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            overflow: visible;
        }
        .page-title {
            font-size: 3rem;
            color: var(--primary-blue);
            animation: textGlow 4s infinite ease-in-out;
            letter-spacing: 2px;
            font-weight: 900;
            overflow: visible;
        }
        .nav-actions {
            display: flex;
            gap: 20px;
            align-items: center;
        }

        .cyber-btn {
            position: relative;
            display: inline-block;
            padding: 15px 30px;
            background: linear-gradient(135deg, var(--primary-blue), var(--primary-purple));
            color: #fff;
            text-decoration: none;
            font-weight: 700;
            font-size: 1.05rem;
            border-radius: 10px;
            border: none;
            overflow: hidden;
            transition: all 0.35s ease;
            cursor: pointer;
            transform-style: preserve-3d;
        }
        .cyber-btn::before {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.35), transparent);
            animation: sweepGlow 3.2s infinite linear;
        }
        .cyber-btn:hover {
            transform: translateY(-4px) scale(1.03) translate3d(0,0,12px);
            animation: pulseGlow 1.8s infinite ease-in-out;
            mix-blend-mode: screen;
        }
        .cyber-btn:active {
            transform: translateY(1px) scale(0.98);
        }
        .logout-btn {
            background: linear-gradient(135deg, #770099, var(--accent-red));
        }

        .dashboard-wrapper {
            position: relative;
            z-index: 1;
            max-width: 1250px;
            margin: 50px auto;
            padding: 0 30px;
        }

        .records-panel {
            background: var(--card-bg);
            backdrop-filter: blur(14px);
            border: 1px solid rgba(0,164,230,0.35);
            border-radius: 18px;
            padding: 40px;
            margin: 0 auto;
            max-width: 700px;
            position: relative;
            overflow: hidden;
            box-shadow: 0 20px 60px rgba(0,164,230,0.25);
            animation: floatUp 6s infinite ease-in-out;
        }
        .records-panel::after {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(201, 68, 255,0.08), transparent);
            animation: sweepGlow 5s infinite linear;
            pointer-events: none;
        }

        .form-group {
            margin-bottom: 25px;
        }
        label {
            display: block;
            font-size: 1.1rem;
            margin-bottom: 10px;
            color: var(--text-white);
        }
        input, select, textarea {
            width: 100%;
            padding: 16px 20px;
            background: var(--input-bg);
            border: 1px solid rgba(0,164,230,0.3);
            border-radius: 10px;
            color: var(--text-white);
            font-size: 1.05rem;
        }
        input:focus, select:focus, textarea:focus {
            outline: none;
            border-color: var(--primary-blue);
            box-shadow: 0 0 20px rgba(0,164,230,0.35);
        }

        .float-logout {
            position: fixed;
            bottom: 35px;
            right: 35px;
            z-index: 9;
        }
    </style>
</head>
<body>
    <canvas id="bg-canvas"></canvas>
    <div class="grid-overlay"></div>

    <nav class="main-nav">
        <h1 class="page-title">ADD NEW RECORD</h1>
        <div class="nav-actions">
            <a href="{% url 'dashboard' %}" class="cyber-btn">← Back</a>
        </div>
    </nav>

    <div class="dashboard-wrapper">
        <div class="records-panel">
            <form method="post">
                {% csrf_token %}
                <div class="form-group">
                    <label>Main Category</label>
                    <select name="main_category">
                        <option value="">--Select Main Category--</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Sub Category (optional)</label>
                    <select name="sub_category">
                        <option value="">--Select Main Category First--</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Transaction Type</label>
                    <select name="transaction_type">
                        <option>Income</option>
                        <option>Expense</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Amount</label>
                    <input type="number" name="amount" required>
                </div>
                <div class="form-group">
                    <label>Remarks (optional)</label>
                    <textarea rows="3" name="remarks"></textarea>
                </div>
                <button class="cyber-btn">Save Record</button>
            </form>
        </div>
    </div>

    <div class="float-logout">
        <a href="{% url 'logout' %}" class="cyber-btn logout-btn">Logout Account</a>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
    <script>
        const canvas = document.getElementById('bg-canvas');
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ canvas, alpha: true, antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

        camera.position.z = 6;

        const geo1 = new THREE.IcosahedronGeometry(1.3, 1);
        const mat1 = new THREE.MeshBasicMaterial({color:0x00a4e6, wireframe:true, transparent:true, opacity:0.22});
        const mesh1 = new THREE.Mesh(geo1, mat1);
        scene.add(mesh1);

        const geo2 = new THREE.OctahedronGeometry(0.95, 0);
        const mat2 = new THREE.MeshBasicMaterial({color:0xc944ff, wireframe:true, transparent:true, opacity:0.18});
        const mesh2 = new THREE.Mesh(geo2, mat2);
        mesh2.position.set(-3, -1.2, -2.5);
        scene.add(mesh2);

        const count1 = 600;
        const geoP1 = new THREE.BufferGeometry();
        const pos1 = new Float32Array(count1 * 3);
        for(let i=0; i<count1*3; i++) pos1[i] = (Math.random()-0.5)*22;
        geoP1.setAttribute('position', new THREE.BufferAttribute(pos1,3));
        const matP1 = new THREE.PointsMaterial({ color:0x00A4E6, size:0.12, transparent:true, opacity:0.6 });
        const particleLayer1 = new THREE.Points(geoP1, matP1);
        scene.add(particleLayer1);

        const count2 = 1400;
        const geoP2 = new THREE.BufferGeometry();
        const pos2 = new Float32Array(count2 *3);
        for(let i=0; i<count2*3; i++) pos2[i] = (Math.random()-0.5)*30;
        geoP2.setAttribute('position', new THREE.BufferAttribute(pos2,3));
        const matP2 = new THREE.PointsMaterial({ color:0xc944ff, size:0.04, transparent:true, opacity:0.4 });
        const particleLayer2 = new THREE.Points(geoP2, matP2);
        scene.add(particleLayer2);

        let mouseX = 0, mouseY = 0;
        window.addEventListener('mousemove', (e)=>{
            mouseX = (e.clientX / window.innerWidth - 0.5) * 0.35;
            mouseY = -(e.clientY / window.innerHeight - 0.5) * 0.35;
            gsap.to(camera.rotation, {x:mouseY, y:mouseX, duration:0.7, ease:"power2.out"});
        });

        const card = document.querySelector('.records-panel');
        card.addEventListener('mousemove', (e)=>{
            const rect = card.getBoundingClientRect();
            const x = e.clientX - rect.left - rect.width/2;
            const y = e.clientY - rect.top - rect.height/2;
            gsap.to(card, {
                rotateY: x * 0.02,
                rotateX: -y * 0.02,
                duration:0.2
            })
        })
        card.addEventListener('mouseleave', ()=>{
            gsap.to(card, {rotateX:0, rotateY:0, duration:0.4})
        })

        function animate() {
            requestAnimationFrame(animate);
            mesh1.rotation.x += 0.003;
            mesh1.rotation.y += 0.005;
            mesh2.rotation.z += 0.004;
            mesh1.position.y = Math.sin(Date.now() * 0.0008) * 0.7;
            mesh2.position.x = Math.cos(Date.now() * 0.0006) * 0.6;
            particleLayer1.rotation.y += 0.0009;
            particleLayer2.rotation.x -= 0.0006;
            renderer.render(scene, camera);
        }
        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        })
    </script>
</body>
</html>
