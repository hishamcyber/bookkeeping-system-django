<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Bookkeeping System</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.12/dist/gsap.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', sans-serif;
        }

        body {
            overflow: hidden;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #121420;
            perspective: 1200px; /* Required CSS 3D depth root */
        }

        #bg-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 1;
            pointer-events: none;
        }

        /* Glassmorphism 3D Tilt Login Card */
        .login-card {
            position: relative;
            z-index: 2;
            background: rgba(20, 22, 36, 0.65);
            backdrop-filter: blur(14px);
            border: 1px solid rgba(0, 164, 230, 0.35);
            border-radius: 20px;
            padding: 45px 35px;
            width: 390px;
            text-align: center;
            transform-style: preserve-3d;
            animation: float 6s ease-in-out infinite;
            box-shadow: 0 20px 60px rgba(0,164,230,0.3);
            mix-blend-mode: screen;
        }

        /* Floating sway animation */
        @keyframes float {
            0% { transform: translateY(0px) rotate3d(0,0,0, 0deg); }
            50% { transform: translateY(-12px) rotate3d(0.3,0.2,0, 1.2deg); }
            100% { transform: translateY(0px) rotate3d(0,0,0, 0deg); }
        }

        h1 {
            color: #00A4E6;
            font-size: 2.5rem;
            margin-bottom: 30px;
            text-shadow: 0 0 14px #c944ff, 0 0 22px rgba(0,164,230,0.6);
        }

        input {
            width: 100%;
            padding: 14px 18px;
            margin: 12px 0;
            background: rgba(25, 28, 45, 0.7);
            border: 1px solid rgba(0, 164, 230, 0.4);
            border-radius: 10px;
            color: #ffffff;
            font-size: 1rem;
            outline: none;
            transition: all 0.3s ease;
        }

        input:focus {
            border-color: #c944ff;
            box-shadow: 0 0 15px rgba(201, 68, 255, 0.5);
        }

        input::placeholder {
            color: #84a5cc;
        }

        button {
            width: 100%;
            padding: 15px;
            margin-top: 18px;
            background: linear-gradient(90deg, #00A4E6, #c944ff);
            border: none;
            border-radius: 10px;
            color: #fff;
            font-weight: bold;
            font-size: 1.1rem;
            cursor: pointer;
            transition: all 0.35s ease;
            box-shadow: 0 0 18px rgba(0,164,230,0.4);
        }

        button:hover {
            box-shadow: 0 0 28px rgba(201, 68, 255, 0.6);
            transform: translateY(-4px) translate3d(0,0,10px);
        }

        button:active {
            transform: translateY(2px);
        }
    </style>
</head>
<body>
    <!-- 3D WebGL Background Canvas -->
    <canvas id="bg-canvas"></canvas>

    <!-- Login Form (Django CSRF kept untouched) -->
    <div class="login-card">
        <h1>Login</h1>
        <form method="post">
            {% csrf_token %}
            <input type="text" name="username" placeholder="Username">
            <input type="password" name="password" placeholder="Password">
            <button type="submit">Login</button>
        </form>
    </div>

    <!-- Three.js + GSAP Script -->
    <script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
    <script>
        const canvas = document.getElementById('bg-canvas');
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ canvas, alpha: true, antialias:true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

        camera.position.z = 6;

        // Floating Wireframe Meshes
        const geo1 = new THREE.IcosahedronGeometry(1.3, 1);
        const mat1 = new THREE.MeshBasicMaterial({color:0x00a4e6, wireframe:true, transparent:true, opacity:0.22});
        const mesh1 = new THREE.Mesh(geo1, mat1);
        scene.add(mesh1);

        const geo2 = new THREE.OctahedronGeometry(0.95, 0);
        const mat2 = new THREE.MeshBasicMaterial({color:0xc944ff, wireframe:true, transparent:true, opacity:0.18});
        const mesh2 = new THREE.Mesh(geo2, mat2);
        mesh2.position.set(-3, -1.2, -2.5);
        scene.add(mesh2);

        // Particle Network
        const particleCount = 900;
        const posArray = new Float32Array(particleCount * 3);
        for(let i = 0; i < particleCount * 3; i++) {
            posArray[i] = (Math.random() - 0.5) * 18;
        }
        const particlesGeo = new THREE.BufferGeometry();
        particlesGeo.setAttribute('position', new THREE.BufferAttribute(posArray, 3));
        const particleMat = new THREE.PointsMaterial({
            color: 0x00A4E6,
            size: 0.09,
            transparent:true,
            opacity:0.6
        });
        const particleCloud = new THREE.Points(particlesGeo, particleMat);
        scene.add(particleCloud);

        // Mouse Parallax Camera Tilt with GSAP
        let mouseX = 0, mouseY = 0;
        window.addEventListener('mousemove', (e)=>{
            mouseX = (e.clientX / window.innerWidth - 0.5) * 0.4;
            mouseY = -(e.clientY / window.innerHeight - 0.5) * 0.4;
            gsap.to(camera.rotation, {x:mouseY, y:mouseX, duration:0.7, ease:"power2.out"});
        });

        // Card 3D Tilt on Mouse Hover
        const card = document.querySelector('.login-card');
        card.addEventListener('mousemove', (e)=>{
            const rect = card.getBoundingClientRect();
            const x = e.clientX - rect.left - rect.width/2;
            const y = e.clientY - rect.top - rect.height/2;
            gsap.to(card, {
                rotateY: x * 0.02,
                rotateX: -y * 0.02,
                duration:0.2
            })
        });
        card.addEventListener('mouseleave', ()=>{
            gsap.to(card, {rotateX:0, rotateY:0, duration:0.4})
        });

        // Animation Loop
        function animate() {
            requestAnimationFrame(animate);
            mesh1.rotation.x += 0.003;
            mesh1.rotation.y += 0.005;
            mesh2.rotation.z += 0.004;
            mesh1.position.y = Math.sin(Date.now() * 0.0008) * 0.7;
            mesh2.position.x = Math.cos(Date.now() * 0.0006) * 0.6;
            particleCloud.rotation.y += 0.0009;
            renderer.render(scene, camera);
        }
        animate();

        // Window Resize
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        })
    </script>
</body>
</html>
